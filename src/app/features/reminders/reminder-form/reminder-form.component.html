<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="space-y-4 rounded-xl bg-white dark:bg-slate-900 p-4 shadow-sm ring-1 ring-slate-200 dark:ring-slate-800"
  novalidate
>
  <div>
    <label for="reminder-title" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Título</label>
    <input
      id="reminder-title"
      type="text"
      formControlName="title"
      placeholder="¿Qué no quieres olvidar?"
      class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-700 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none"
    />
    @if (form.controls.title.touched && form.controls.title.invalid) {
      <p class="mt-1 text-xs text-rose-600 dark:text-rose-400">{{ titleError() }}</p>
    }
  </div>

  <div>
    <label for="reminder-remind-at" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Fecha y hora</label>
    <input
      id="reminder-remind-at"
      type="datetime-local"
      formControlName="remindAt"
      class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-700 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none"
    />
    @if (form.controls.remindAt.touched && form.controls.remindAt.invalid) {
      <p class="mt-1 text-xs text-rose-600 dark:text-rose-400">La fecha y hora son obligatorias.</p>
    }
  </div>

  <div class="flex justify-end gap-2">
    <button type="button" (click)="cancelled.emit()" class="rounded-lg px-3 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
      Cancelar
    </button>
    <button type="submit" class="rounded-lg bg-slate-900 dark:bg-slate-100 dark:text-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 dark:hover:bg-slate-300">
      Guardar
    </button>
  </div>
</form>
