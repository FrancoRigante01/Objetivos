<nav class="flex flex-col gap-6 overflow-y-auto p-4" aria-label="Navegación principal">
  <app-global-search (navigate)="navigate.emit()" />

  <section>
    <ul class="space-y-1">
      @for (item of smartLists; track item.key) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-slate-100 dark:bg-slate-800 font-medium text-slate-900 dark:text-slate-100"
            (click)="navigate.emit()"
            class="flex items-center justify-between rounded-lg px-3 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
          >
            <span>{{ item.title }}</span>
            <span class="text-xs text-slate-400 dark:text-slate-500">{{ smartListCount(item.key) }}</span>
          </a>
        </li>
      }
    </ul>
  </section>

  <section>
    <ul class="space-y-1">
      <li>
        <a
          routerLink="/recordatorios"
          routerLinkActive="bg-slate-100 dark:bg-slate-800 font-medium text-slate-900 dark:text-slate-100"
          (click)="navigate.emit()"
          class="flex items-center justify-between rounded-lg px-3 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
        >
          <span>Recordatorios</span>
          <span class="text-xs text-slate-400 dark:text-slate-500">{{ pendingReminders() }}</span>
        </a>
      </li>
    </ul>
  </section>

  <section>
    <h2 class="px-3 text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">Listas</h2>
    <ul class="mt-2 space-y-1">
      @for (list of lists(); track list.id) {
        <li>
          <a
            [routerLink]="['/listas', list.id]"
            routerLinkActive="bg-slate-100 dark:bg-slate-800 font-medium text-slate-900 dark:text-slate-100"
            (click)="navigate.emit()"
            class="flex items-center justify-between gap-2 rounded-lg px-3 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
          >
            <span class="truncate">{{ list.name }}</span>
            <span class="text-xs text-slate-400 dark:text-slate-500">{{ pendingCount(list.id) }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="mt-2 px-1">
      @if (creatingList()) {
        <app-list-name-form submitLabel="Crear" (saved)="createList($event)" (cancelled)="creatingList.set(false)" />
      } @else {
        <button
          type="button"
          (click)="creatingList.set(true)"
          class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100"
        >
          <span aria-hidden="true">+</span> Nueva lista
        </button>
      }
    </div>
  </section>

  <app-data-transfer />
</nav>
