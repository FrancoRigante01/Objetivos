<div class="flex min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
  @if (menuOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-slate-900/30 dark:bg-black/50 md:hidden"
      aria-label="Cerrar menú"
      (click)="closeMenu()"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 w-72 overflow-y-auto border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 transition-transform duration-200 md:static md:translate-x-0"
    [class.-translate-x-full]="!menuOpen()"
  >
    <div class="flex h-14 items-center justify-between px-6 text-lg font-semibold">
      <span>Objetivos</span>
      <app-theme-toggle />
    </div>
    <app-sidebar (navigate)="closeMenu()" />
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 items-center gap-3 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 md:hidden">
      <button
        type="button"
        class="rounded-lg p-2 hover:bg-slate-100 dark:hover:bg-slate-700"
        aria-label="Abrir menú"
        (click)="toggleMenu()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <span class="font-semibold">Objetivos</span>
      <app-theme-toggle class="ml-auto" />
    </header>

    <main class="flex-1 p-4 md:p-8">
      <router-outlet />
    </main>
  </div>
</div>
